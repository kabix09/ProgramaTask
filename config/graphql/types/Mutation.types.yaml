Mutation:
    type: object
    config:
        fields:
            createTask:
                type: "Task"
                args:
                    title:
                        type: "String!"
                    description:
                        type: "String!"
                resolve: "@=service('TaskMutation').create(args)"
            syncUsers:
                type: "Boolean!"
                resolve: "@=service('UserMutation').sync()"
