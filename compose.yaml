services:
  app:
    build: .
    volumes:
      - .:/var/www:rw
      - /var/www/vendor
    env_file:
      - .env
      - .env.local
    environment:
      DB_HOST: database
    depends_on:
      database:
        condition: service_healthy

  messenger-worker:
    build: .
    env_file:
      - .env
      - .env.local
    environment:
      DB_HOST: database
    command: php bin/console messenger:consume events -vv
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - .:/var/www:rw

  database:
    image: postgres:${DB_SERVER_VERSION:-16}-alpine
    ports:
      - "${DB_PORT:-5432}:5432"
    env_file:
      - .env
      - .env.local
    environment:
      POSTGRES_DB: ${DB_NAME:-app}
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-!ChangeMe!}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${DB_NAME:-app}", "-U", "${DB_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw

volumes:
  database_data:
